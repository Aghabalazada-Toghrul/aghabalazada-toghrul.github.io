<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>overflow test</title></head>
<body><pre id="out">running...</pre>
<script>
const pages = ['index.html', 'index_az.html', 'index_tr.html', 'index_ru.html'];
const widths = [320, 360, 375, 390, 414, 768];
const results = [];
function run(page, w) {
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:' + w + 'px;height:800px;border:0;position:absolute;left:0;top:0';
    f.onload = () => setTimeout(() => {
      const d = f.contentDocument, de = d.documentElement;
      const bad = [];
      d.querySelectorAll('body *').forEach(el => {
        const r = el.getBoundingClientRect();
        const cs = f.contentWindow.getComputedStyle(el);
        const rectOver = r.width > 0 && r.right > de.clientWidth + 1 && !el.closest('.truncate') && cs.position !== 'absolute' && cs.position !== 'fixed';
        const textOver = cs.display !== 'inline' && el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 1 && cs.overflowX === 'visible' && !el.closest('svg');
        if (rectOver || textOver) bad.push((textOver ? 'TEXT ' : 'RECT ') + el.tagName.toLowerCase() + '.' + String(el.className).split(' ').slice(0, 3).join('.') + ' sw=' + el.scrollWidth + ' cw=' + el.clientWidth + ' "' + (el.textContent || '').trim().slice(0, 24) + '"');
      });
      const fonts = d.fonts ? [...d.fonts].filter(x => x.status === 'loaded').map(x => x.family).length : -1;
      results.push({ page, w, scrollWidth: de.scrollWidth, overflow: de.scrollWidth > de.clientWidth, badCount: bad.length, bad: bad.slice(0, 6), fontsLoaded: fonts, js: de.classList.contains('js') });
      f.remove(); res();
    }, 600);
    f.src = page;
    document.body.appendChild(f);
  });
}
(async () => {
  for (const p of pages) for (const w of widths) await run(p, w);
  document.getElementById('out').textContent = 'RESULT_START\n' + JSON.stringify(results, null, 1) + '\nRESULT_END';
})();
</script></body></html>
